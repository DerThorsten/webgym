<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webgym</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
      #app { display: flex; height: 100dvh; }
      #side { width: 300px; padding: 12px; box-sizing: border-box; overflow: auto; background: #1b1b1b; }
      #stage { flex: 1; position: relative; min-width: 0; }
      #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      h3 { margin: 0 0 8px; }
      h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; color: #888; }
      .bar { margin: 8px 0; }
      .bar label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
      .bar progress { width: 100%; }
      .control { margin: 8px 0; }
      .control label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
      .control select, .control input { width: 100%; }
      .control.checkbox label { justify-content: flex-start; gap: 6px; align-items: center; }
      .control.checkbox input { width: auto; margin: 0; }
      .info { font-size: 12px; color: #999; white-space: pre-wrap; margin: 6px 0 10px; }
      .info summary { cursor: pointer; color: #bbb; white-space: normal; }
      .hint { font-size: 12px; color: #999; margin: -4px 0 8px; }
      .hint.active { color: #fff; background: #2f6fd6; padding: 6px 8px; border-radius: 3px; margin: 0 0 8px; }
      button { margin: 4px 4px 0 0; padding: 4px 10px; }
      button.primary { background: #2f6fd6; color: #fff; border: 0; border-radius: 3px; }
      #plot, #loss-plot { width: 100%; height: 160px; display: block; --grid: #444; color: #aaa; }
      #loss-plot { height: 110px; margin-top: 6px; }
      #loss-plot[hidden] { display: none; }
      details.group { margin: 8px 0; padding: 4px 8px; background: #222; border-radius: 3px; }
      details.group summary { cursor: pointer; font-size: 12px; color: #bbb; }
      #state { font: 12px monospace; color: #8c8; white-space: pre; }
      #score { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); pointer-events: none;
               background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px 18px; border-radius: 6px; text-align: center; }
      #score .big, #busy .big { font-size: 28px; font-weight: 600; }
      #score .small, #busy .small { font-size: 12px; color: #bbb; margin-top: 2px; }
      #busy { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
              background: rgba(0, 0, 0, 0.7); color: #fff; padding: 16px 24px; border-radius: 8px; text-align: center; }
      #busy[hidden], #score[hidden] { display: none; }
      .package-result { font-size: 11px; color: #999; margin: 4px 0; }
      .ckpt-save { display: flex; gap: 4px; }
      .ckpt-save input { flex: 1; min-width: 0; }
      .ckpt-save button { margin: 0; }
      #ckpt-list { font-size: 12px; color: #999; margin-top: 6px; }
      .ckpt { display: flex; align-items: center; gap: 4px; padding: 4px 0; border-top: 1px solid #2a2a2a; }
      .ckpt > div { flex: 1; min-width: 0; color: #ddd; overflow: hidden; text-overflow: ellipsis; }
      .ckpt .meta { color: #888; font-size: 11px; }
      .ckpt button { margin: 0; padding: 2px 6px; font-size: 11px; }
      #status.error { color: #f66; white-space: pre-wrap; font: 11px monospace; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <h3>webgym</h3>
        <div id="bars"></div>
        <div id="controls"></div>
        <h4>Training</h4>
        <canvas id="plot"></canvas>
        <canvas id="loss-plot" hidden></canvas>
        <div id="state"></div>
        <h4>Checkpoints</h4>
        <div class="ckpt-save">
          <input id="ckpt-name" placeholder="name for a checkpoint" />
          <button id="ckpt-save">Save</button>
        </div>
        <div id="ckpt-list"></div>
        <h4>Packages</h4>
        <div id="packages"></div>
        <p id="status"></p>
      </div>
      <div id="stage"><canvas id="canvas"></canvas><div id="score" hidden></div><div id="busy" hidden></div></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
