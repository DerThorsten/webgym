[project]
name = "webgym"
# the release: bump it when the page's saved data (runs, checkpoints, code edits) no longer
# fits; browsers that ran an older release are asked to delete theirs (web/main.js)
version = "0.2.0"
description = "Gymnasium-like box2d (pyb2d3) environments with live training, native and in the browser"
requires-python = ">=3.14"
dependencies = ["numpy", "pyb2d3>=1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webgym"]

[tool.ruff]
line-length = 100
