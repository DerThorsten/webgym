[project]
name = "webgym"
version = "0.1.0"
description = "Gymnasium-like box2d (pyb2d3) environments with live training, native and in the browser"
requires-python = ">=3.14"
dependencies = ["numpy", "pyb2d3>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webgym"]

[tool.ruff]
line-length = 100
