# Test, build the page (web/dist) and deploy it to GitHub Pages on every push to main
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Tests
        run: pixi run test
      - name: The pretrained runs (assets of the release "pretrained-<version>", see web/pretrain.py)
        run: pixi run python web/pretrain.py --download
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the page
        run: pixi run web-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
